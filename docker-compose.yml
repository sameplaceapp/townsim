version: "3.8"
services:
  townsim:
    build: .
    ports:
      - "3000:3000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-0}
      CALENDAR_DAYS_PER_YEAR: ${CALENDAR_DAYS_PER_YEAR:-}
    volumes:
      - townsim-data:/app/data
    restart: unless-stopped

volumes:
  townsim-data:
