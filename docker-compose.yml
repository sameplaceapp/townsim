version: "3.8"
services:
  townsim:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - townsim-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  townsim-data:
