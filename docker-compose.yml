version: "3.8"
services:
  townsim:
    build: .
    ports:
      - "3000:3000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-0}
    volumes:
      - townsim-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  townsim-data:
